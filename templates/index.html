<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异常店治理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 1000px; margin-top: 80px; }
        .page-title { text-align: center; margin-bottom: 50px; }
        .card-menu { text-align: center; padding: 40px 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); transition: all 0.3s; cursor: pointer; }
        .card-menu:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .card-icon { font-size: 4rem; margin-bottom: 20px; }
        .card-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-title">
            <h1>异常店治理</h1>
            <p class="text-muted mt-3">请选择需要使用的功能</p>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-6 mb-4">
                <div class="card card-menu" onclick="location.href='/follow_up'">
                    <div class="card-icon">🏪</div>
                    <h3 class="card-title">门店跟进治理</h3>
                    <p class="text-muted">管理和跟进门店的治理情况</p>
                </div>
            </div>
            
            <div class="col-md-6 mb-4">
                <div class="card card-menu" onclick="location.href='/daily_import'">
                    <div class="card-icon">📊</div>
                    <h3 class="card-title">日报导入</h3>
                    <p class="text-muted">导入和管理门店的日报数据</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
