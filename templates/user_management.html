<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号管理 - 门店治理平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .navbar { 
            background: rgba(255,255,255,0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .navbar-brand { color: #667eea !important; font-weight: 700; }
        .nav-link { color: #495057 !important; }
        .nav-link:hover { color: #667eea !important; }
        .container { max-width: 1400px; margin-top: 30px; }
        .card { 
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border: none;
            padding: 20px 24px;
            font-weight: 600;
            color: #495057;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 10px 24px;
            font-weight: 600;
            border-radius: 10px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .table thead th {
            background: #f8f9fa;
            border: none;
            font-weight: 600;
            color: #495057;
            padding: 16px;
        }
        .table tbody td {
            padding: 14px 16px;
            vertical-align: middle;
            border-bottom: 1px solid #f0f0f0;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-enabled { background: #d4edda; color: #155724; }
        .badge-disabled { background: #f8d7da; color: #721c24; }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <a class="navbar-brand me-4" href="/">
                    <i class="bi bi-shop me-2"></i>门店治理平台
                </a>
                <ul class="nav nav-pills">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/daily_import">日报导入</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/follow_up">跟进治理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/store_profile">门店档案</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/user_management">账号管理</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted">
                    <i class="bi bi-person-circle me-1"></i>
                    <span id="currentUserName">管理员</span>
                </span>
                <a href="/logout" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Nav tabs -->
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users-panel" type="button">
                    <i class="bi bi-people me-2"></i>账号列表
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="login-logs-tab" data-bs-toggle="tab" data-bs-target="#login-logs-panel" type="button">
                    <i class="bi bi-clock-history me-2"></i>登录日志
                </button>
            </li>
        </ul>

        <!-- Tab panels -->
        <div class="tab-content">
            <!-- 账号列表 -->
            <div class="tab-pane fade show active" id="users-panel">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-people me-2"></i>账号列表</span>
                        <button class="btn btn-primary" onclick="showAddUserModal()">
                            <i class="bi bi-plus-lg me-1"></i>新建账号
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>用户ID</th>
                                        <th>用户名</th>
                                        <th>显示名称</th>
                                        <th>角色</th>
                                        <th>状态</th>
                                        <th>最后登录</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="userTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 登录日志 -->
            <div class="tab-pane fade" id="login-logs-panel">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-clock-history me-2"></i>登录日志</span>
                        <button class="btn btn-outline-secondary btn-sm" onclick="loadLoginLogs()">
                            <i class="bi bi-arrow-clockwise me-1"></i>刷新
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="row">
                                <div class="col-md-3">
                                    <label class="form-label">用户名</label>
                                    <input type="text" class="form-control" id="logUsernameFilter" placeholder="筛选用户名">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">登录状态</label>
                                    <select class="form-select" id="logStatusFilter">
                                        <option value="">全部</option>
                                        <option value="成功">成功</option>
                                        <option value="失败">失败</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">开始日期</label>
                                    <input type="date" class="form-control" id="logStartDate">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">结束日期</label>
                                    <input type="date" class="form-control" id="logEndDate">
                                </div>
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-primary" onclick="loadLoginLogs()">
                                    <i class="bi bi-search me-1"></i>查询
                                </button>
                                <button class="btn btn-outline-secondary ms-2" onclick="resetLogFilters()">
                                    <i class="bi bi-eraser me-1"></i>重置
                                </button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>日志ID</th>
                                        <th>用户名</th>
                                        <th>登录状态</th>
                                        <th>IP地址</th>
                                        <th>登录时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="loginLogTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted">加载中...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加用户Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>新建账号</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">用户名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="newUsername" placeholder="请输入用户名">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">显示名称</label>
                            <input type="text" class="form-control" id="newDisplayName" placeholder="请输入显示名称">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="newPassword" placeholder="至少6位密码">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">角色</label>
                            <select class="form-select" id="newRole">
                                <option value="user">普通用户</option>
                                <option value="admin">管理员</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">页面权限</label>
                        <div id="permissionCheckboxes" class="row"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addUser()">
                        <i class="bi bi-check-lg me-1"></i>创建
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑用户Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>编辑账号</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editUserId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="editUsername" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">显示名称</label>
                            <input type="text" class="form-control" id="editDisplayName">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">新密码（留空则不修改）</label>
                            <input type="password" class="form-control" id="editPassword" placeholder="不修改请留空">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">角色</label>
                            <select class="form-select" id="editRole">
                                <option value="user">普通用户</option>
                                <option value="admin">管理员</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">状态</label>
                            <select class="form-select" id="editStatus">
                                <option value="启用">启用</option>
                                <option value="禁用">禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">页面权限</label>
                        <div id="editPermissionCheckboxes" class="row"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="updateUser()">
                        <i class="bi bi-check-lg me-1"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allPermissions = [];
        let allUsers = [];
        const addUserModal = new bootstrap.Modal(document.getElementById('addUserModal'));
        const editUserModal = new bootstrap.Modal(document.getElementById('editUserModal'));

        document.addEventListener('DOMContentLoaded', function() {
            loadCurrentUser();
            loadUsers();
        });

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/current_user');
                const result = await response.json();
                if (result.success) {
                    document.getElementById('currentUserName').textContent = result.data.display_name || result.data.username;
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const result = await response.json();
                
                if (result.success) {
                    allUsers = result.data.users;
                    allPermissions = result.data.permissions;
                    renderUserTable();
                }
            } catch (error) {
                console.error('加载用户列表失败:', error);
            }
        }

        function renderUserTable() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = allUsers.map(user => `
                <tr>
                    <td>${user.用户ID}</td>
                    <td class="fw-semibold">${user.用户名}</td>
                    <td>${user.显示名称 || '-'}</td>
                    <td>
                        <span class="badge ${user.角色 === 'admin' ? 'bg-danger' : 'bg-info'}">
                            ${user.角色 === 'admin' ? '管理员' : '普通用户'}
                        </span>
                    </td>
                    <td>
                        <span class="badge-status ${user.状态 === '启用' ? 'badge-enabled' : 'badge-disabled'}">
                            ${user.状态}
                        </span>
                    </td>
                    <td>${user.最后登录时间 || '从未登录'}</td>
                    <td>${user.创建时间}</td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm me-1" onclick="showEditUserModal(${user.用户ID})">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-outline-danger btn-sm" onclick="deleteUser(${user.用户ID}, '${user.用户名}')">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function renderPermissionCheckboxes(containerId, selectedPermissions = []) {
            const container = document.getElementById(containerId);
            const selectedIds = selectedPermissions.map(p => p.权限ID);
            
            container.innerHTML = allPermissions.map(perm => `
                <div class="col-md-4 mb-2">
                    <div class="form-check">
                        <input class="form-check-input permission-checkbox" type="checkbox" 
                            value="${perm.权限ID}" id="perm_${containerId}_${perm.权限ID}"
                            ${selectedIds.includes(perm.权限ID) ? 'checked' : ''}>
                        <label class="form-check-label" for="perm_${containerId}_${perm.权限ID}">
                            ${perm.权限名称}
                        </label>
                    </div>
                </div>
            `).join('');
        }

        function getSelectedPermissions(containerId) {
            const checkboxes = document.querySelectorAll(`#${containerId} .permission-checkbox:checked`);
            return Array.from(checkboxes).map(cb => parseInt(cb.value));
        }

        function showAddUserModal() {
            document.getElementById('newUsername').value = '';
            document.getElementById('newDisplayName').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('newRole').value = 'user';
            renderPermissionCheckboxes('permissionCheckboxes');
            addUserModal.show();
        }

        async function showEditUserModal(userId) {
            const user = allUsers.find(u => u.用户ID === userId);
            if (!user) return;

            document.getElementById('editUserId').value = userId;
            document.getElementById('editUsername').value = user.用户名;
            document.getElementById('editDisplayName').value = user.显示名称 || '';
            document.getElementById('editPassword').value = '';
            document.getElementById('editRole').value = user.角色;
            document.getElementById('editStatus').value = user.状态;

            // 加载用户权限
            try {
                const response = await fetch(`/api/admin/user_permissions/${userId}`);
                const result = await response.json();
                if (result.success) {
                    renderPermissionCheckboxes('editPermissionCheckboxes', result.data);
                }
            } catch (error) {
                console.error('加载用户权限失败:', error);
            }

            editUserModal.show();
        }

        async function addUser() {
            const username = document.getElementById('newUsername').value.trim();
            const displayName = document.getElementById('newDisplayName').value.trim();
            const password = document.getElementById('newPassword').value;
            const role = document.getElementById('newRole').value;
            const permissions = getSelectedPermissions('permissionCheckboxes');

            if (!username || !password) {
                alert('用户名和密码不能为空');
                return;
            }

            try {
                const response = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        display_name: displayName,
                        password,
                        role,
                        permissions
                    })
                });

                const result = await response.json();
                if (result.success) {
                    addUserModal.hide();
                    await loadUsers();
                    alert('用户创建成功');
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('创建用户失败:', error);
                alert('创建失败');
            }
        }

        async function updateUser() {
            const userId = document.getElementById('editUserId').value;
            const displayName = document.getElementById('editDisplayName').value.trim();
            const password = document.getElementById('editPassword').value;
            const role = document.getElementById('editRole').value;
            const status = document.getElementById('editStatus').value;
            const permissions = getSelectedPermissions('editPermissionCheckboxes');

            const data = {
                display_name: displayName,
                role,
                status,
                permissions
            };

            if (password) {
                data.password = password;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    editUserModal.hide();
                    await loadUsers();
                    alert('用户更新成功');
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('更新用户失败:', error);
                alert('更新失败');
            }
        }

        async function deleteUser(userId, username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    await loadUsers();
                    alert('用户删除成功');
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('删除用户失败:', error);
                alert('删除失败');
            }
        }

        // 登录日志相关函数
        document.addEventListener('DOMContentLoaded', function() {
            // 当点击登录日志标签时加载数据
            document.getElementById('login-logs-tab').addEventListener('shown.bs.tab', function() {
                loadLoginLogs();
            });
        });

        async function loadLoginLogs() {
            const username = document.getElementById('logUsernameFilter').value.trim();
            const status = document.getElementById('logStatusFilter').value;
            const startDate = document.getElementById('logStartDate').value;
            const endDate = document.getElementById('logEndDate').value;

            const tbody = document.getElementById('loginLogTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>加载中...</td></tr>';

            try {
                const params = new URLSearchParams();
                if (username) params.append('username', username);
                if (status) params.append('status', status);
                if (startDate) params.append('start_date', startDate);
                if (endDate) params.append('end_date', endDate);

                const url = '/api/admin/login_logs' + (params.toString() ? '?' + params.toString() : '');
                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    renderLoginLogsTable(result.data);
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">加载失败: ${result.message}</td></tr>`;
                }
            } catch (error) {
                console.error('加载登录日志失败:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">加载失败，请稍后重试</td></tr>';
            }
        }

        function renderLoginLogsTable(logs) {
            const tbody = document.getElementById('loginLogTableBody');

            if (!logs || logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无登录记录</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(log => `
                <tr>
                    <td>${log.日志ID}</td>
                    <td class="fw-semibold">${log.用户名}</td>
                    <td>
                        <span class="badge ${log.登录状态 === '成功' ? 'bg-success' : 'bg-danger'}">
                            ${log.登录状态}
                        </span>
                    </td>
                    <td>${log.IP地址 || '-'}</td>
                    <td>${log.登录时间}</td>
                    <td>
                        <button class="btn btn-outline-info btn-sm" onclick="viewLogDetail(${log.日志ID})">
                            <i class="bi bi-eye"></i> 详情
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function resetLogFilters() {
            document.getElementById('logUsernameFilter').value = '';
            document.getElementById('logStatusFilter').value = '';
            document.getElementById('logStartDate').value = '';
            document.getElementById('logEndDate').value = '';
            loadLoginLogs();
        }

        async function viewLogDetail(logId) {
            try {
                const response = await fetch(`/api/admin/login_logs/${logId}`);
                const result = await response.json();

                if (result.success) {
                    const log = result.data;
                    const detailHtml = `
                        <div class="mb-3">
                            <strong>日志ID:</strong> ${log.日志ID}
                        </div>
                        <div class="mb-3">
                            <strong>用户名:</strong> ${log.用户名}
                        </div>
                        <div class="mb-3">
                            <strong>登录状态:</strong>
                            <span class="badge ${log.登录状态 === '成功' ? 'bg-success' : 'bg-danger'} ms-2">
                                ${log.登录状态}
                            </span>
                        </div>
                        <div class="mb-3">
                            <strong>IP地址:</strong> ${log.IP地址 || '-'}
                        </div>
                        <div class="mb-3">
                            <strong>登录时间:</strong> ${log.登录时间}
                        </div>
                        <div class="mb-3">
                            <strong>用户代理:</strong><br>
                            <small class="text-muted">${log.用户代理 || '-'}</small>
                        </div>
                    `;

                    document.getElementById('logDetailContent').innerHTML = detailHtml;
                    new bootstrap.Modal(document.getElementById('logDetailModal')).show();
                } else {
                    alert('加载详情失败: ' + result.message);
                }
            } catch (error) {
                console.error('加载日志详情失败:', error);
                alert('加载详情失败');
            }
        }
    </script>

    <!-- 登录日志详情Modal -->
    <div class="modal fade" id="logDetailModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-info-circle me-2"></i>登录日志详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="logDetailContent">
                    <!-- 动态填充 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
